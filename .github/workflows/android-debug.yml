name: Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify and prepare sweet-rush-debug.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          cp "$APK_PATH" sweet-rush-debug.apk
          ls -lh sweet-rush-debug.apk

      - name: Upload sweet-rush-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-rush-debug
          path: sweet-rush-debug.apk
          if-no-files-found: error
