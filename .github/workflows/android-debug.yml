name: Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify debug/debug.apk and prepare artifact
        run: |
          test -s debug/debug.apk
          cp debug/debug.apk sweet-rush-debug.apk
          ls -lh debug/debug.apk sweet-rush-debug.apk

      - name: Upload debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-rush-debug
          path: |
            debug/debug.apk
            sweet-rush-debug.apk
          if-no-files-found: error
